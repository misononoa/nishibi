<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:hx="http://wimdeblauwe.github.io/htmx-spring-boot-thymeleaf"
    xmlns:nishibi="http://nishibi.misononoa.cc/nishibi" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<style layout:fragment="styles" th:nonce="${_nonce}">
    #post-detail>.post-content h1 {
        font-size: 1.6rem;
    }

    #post-detail>.post-content h2 {
        font-size: 1.5rem;
    }

    #post-detail>.post-content h3 {
        font-size: 1.4rem;
    }

    #post-detail>.post-content h4 {
        font-size: 1.3rem;
    }

    #post-detail>.post-content h5 {
        font-size: 1.2rem;
    }

    #post-detail>.post-content h6 {
        font-size: 1.1rem;
    }

    #post-detail>.post-content pre {
        border-radius: 0.4rem;
        padding: 0.7rem;
        background-color: rgb(48, 48, 48);
        color: white;
        font-family: 'M PLUS 1 Code Medium';
        font-size: 1.1rem;
    }

    aside.relations {
        margin-top: 2rem;
    }

    article.related-post {
        border-color: var(--bordercolor);
        border-left-style: dotted;
        border-left-width: 3px;
    }

    article.related-post>div {
        margin-left: 0.4rem;
    }

    article.related-post>hr {
        margin: 3px 0;
        border-top-style: none;
    }
</style>

<main layout:fragment="contents">
    <article th:fragment="post-detail" id="post-detail" class="post-detail">
        <div class="post-header">
            <div th:text="|postHash: ${post.postHash}|"></div>
            <div th:text="|createdAt: ${post.createdAt}|"></div>
        </div>
        <hr>
        <div class="post-content" nishibi:render="${post.content}"></div>
    </article>

    <aside class="relations" th:if="${!post.postRelations.isEmpty()}">
        <h2>
            <span style="font-size: 80%;">relations</span>
        </h2>
        <article class="related-post" th:each="relation : ${post.postRelations}"
            th:with="relatedPost=${relation.relatedPost}">
            <div>
                <a th:href="@{'/post/' + ${relatedPost.abbrevHash}}" th:text="|#${relatedPost.abbrevHash}|"></a>
                <span th:text="${#temporals.format(relatedPost.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></span>
            </div>
            <hr>
            <div
                th:text="${#strings.length(relatedPost.content) gt 120 ? #strings.substring(relatedPost.content, 0, 120) + '...' : relatedPost.content}">
            </div>
        </article>
    </aside>
</main>
<footer layout:fragment="custom-footer">
    <div><a href="/">&lt;&nbsp;top</a></div>
</footer>

</html>
